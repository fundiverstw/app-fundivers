<div class="card">
  <div class="title-bar" id="title"></div>

  <div class="content">
    <div class="photo-wrap" id="photoWrap">
      <span class="photo-fallback" id="photoFallback"></span>
    </div>

    <div class="subfields">
      <div class="subfield" id="scheduleField">
        <span class="subfield-label">Schedule</span>
        <span class="subfield-value" id="schedule"></span>
      </div>
      <div class="subfield" id="priceField">
        <span class="subfield-label">Price</span>
        <span class="subfield-value" id="price"></span>
      </div>
      <div class="subfield" id="prereqsField">
        <span class="subfield-label">Prerequisites</span>
        <span class="subfield-value" id="prereqs"></span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="book-btn" id="learnBtn" style="display:none">Learn More</button>
    <button class="book-btn" id="bookBtn">Book Now</button>
  </div>
</div>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 1rem;
    background: transparent;
    color: #1a1a1a;
  }
  .card {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .title-bar {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid #cc0000;
    border-radius: 18px;
    padding: 1.6rem 2rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 2.6rem;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.1;
    text-align: center;
    letter-spacing: 0.005em;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .title-bar::after {
    content: '';
    display: block;
    width: 64px;
    height: 3px;
    background: #cc0000;
    margin: 0.7rem auto 0;
    border-radius: 2px;
  }

  .content {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 1.25rem;
    align-items: start;
  }
  .photo-wrap {
    aspect-ratio: 4 / 3;
    border: 1px solid #cc0000;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.5);
    position: relative;
  }
  .featured-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #999;
    font-size: 0.85rem;
  }

  .subfields {
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid #cc0000;
    border-radius: 16px;
    padding: 1.1rem 1.5rem;
  }
  .subfield {
    display: none;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0.85rem 0;
  }
  .subfield.has-content { display: flex; }
  .subfield.has-content ~ .subfield.has-content {
    border-top: 1px solid rgba(204, 0, 0, 0.18);
  }
  .subfield-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #cc0000;
    font-weight: 700;
  }
  .subfield-value {
    font-size: 1.05rem;
    color: #1a1a1a;
    line-height: 1.55;
    white-space: pre-wrap;
    font-weight: 500;
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 0.5rem 0;
  }
  .book-btn {
    background: transparent;
    border: 1px solid #2ecc71;
    color: #fff;
    border-radius: 99px;
    padding: 0.8rem 2.5rem;
    min-width: 200px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .book-btn:hover {
    background: #2ecc71;
    border-color: #2ecc71;
    color: #fff;
  }

  @media (max-width: 720px) {
    .content { grid-template-columns: 1fr; }
    .title-bar { font-size: 1.6rem; padding: 1.1rem 1.25rem; }
  }
</style>

<script>
  let currentId = null;

  const LEARN_MORE_URLS = {
    'Open Water Course':    'https://www.fundiverstw.com/courses-1/padi-open-water-course',
    'Advanced Open Water':  'https://www.fundiverstw.com/courses-1/padi-advanced-course',
    'PADI Rescue Course':   'https://www.fundiverstw.com/courses-1/padi-rescue-diver-course',
    'EFR Course':           'https://www.fundiverstw.com/courses-1/padi-efr-course',
    'Deep Specialty':       'https://www.fundiverstw.com/courses-1/padi-deep-diver-specialty',
    'Equipment Course':     'https://www.fundiverstw.com/courses-1/padi-equipment-specialist',
  };

  window.addEventListener('message', (e) => {
    const ev = e.data;
    if (!ev || typeof ev !== 'object') return;
    if (ev.type) return;
    render(ev);
  });

  function render(ev) {
    currentId = ev.id || null;

    document.getElementById('title').textContent = ev.title || '';

    const photoWrap = document.getElementById('photoWrap');
    const fallback = document.getElementById('photoFallback');
    photoWrap.innerHTML = '';
    photoWrap.appendChild(fallback);
    if (ev.image) {
      const img = document.createElement('img');
      img.className = 'featured-photo';
      img.src = ev.image;
      img.alt = ev.title || '';
      img.onerror = () => {
        photoWrap.innerHTML = '';
        photoWrap.appendChild(fallback);
        fallback.textContent = '(no image)';
      };
      photoWrap.appendChild(img);
    } else {
      fallback.textContent = '(no image)';
    }

    setSubfield('scheduleField', 'schedule', ev.schedule);
    setSubfield('priceField', 'price', formatPrice(ev.price));
    setSubfield('prereqsField', 'prereqs', ev.prereqs);

    const learnBtn = document.getElementById('learnBtn');
    const learnUrl = LEARN_MORE_URLS[(ev.title || '').trim()];
    if (learnUrl) {
      learnBtn.style.display = '';
      learnBtn.onclick = () => window.open(learnUrl, '_blank', 'noopener');
    } else {
      learnBtn.style.display = 'none';
      learnBtn.onclick = null;
    }
  }

  function setSubfield(fieldId, valueId, value) {
    const field = document.getElementById(fieldId);
    if (value && String(value).trim()) {
      document.getElementById(valueId).textContent = value;
      field.classList.add('has-content');
    } else {
      field.classList.remove('has-content');
    }
  }

  function formatPrice(p) {
    if (p == null) return '';
    const n = parseInt(p, 10);
    if (isNaN(n)) return '';
    return n.toLocaleString() + ' NTD';
  }

  document.getElementById('bookBtn').addEventListener('click', () => {
    if (!currentId) return;
    window.parent.postMessage({ type: 'book', id: currentId }, '*');
  });
</script>
