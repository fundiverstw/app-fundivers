<div class="card">
  <div class="title-bar" id="title"></div>

  <div class="content">
    <div class="left-col">
      <div class="photo-wrap" id="photoWrap">
        <span class="photo-fallback" id="photoFallback"></span>
      </div>
    </div>

    <div class="right-col">
      <div class="subfields">
        <div class="subfield" id="scheduleField">
          <span class="subfield-label">Schedule</span>
          <span class="subfield-value" id="schedule"></span>
        </div>
        <div class="subfield" id="priceField">
          <span class="subfield-label">Price</span>
          <span class="subfield-value" id="price"></span>
        </div>
        <div class="subfield" id="prereqsField">
          <span class="subfield-label">Prerequisites</span>
          <span class="subfield-value" id="prereqs"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="content-secondary">
    <div class="subfields" id="extraPanel">
      <div class="subfield" id="includedField">
        <span class="subfield-label">Included</span>
        <span class="subfield-value" id="included"></span>
      </div>
      <div class="subfield" id="notIncludedField">
        <span class="subfield-label">Not Included</span>
        <span class="subfield-value" id="notIncluded"></span>
      </div>
      <div class="subfield" id="transportationField">
        <span class="subfield-label">Transportation</span>
        <span class="subfield-value" id="transportation"></span>
      </div>
      <div class="subfield" id="cancellationField">
        <span class="subfield-label">Cancellation Policy</span>
        <span class="subfield-value" id="cancellation">
          <span class="cancel-deadline" id="cancelDeadline"></span><span id="cancellationText"></span>
        </span>
      </div>
    </div>

    <div class="photo-wrap" id="photoWrap2">
      <span class="photo-fallback" id="photoFallback2"></span>
    </div>
  </div>

  <div class="subfields" id="roomsPanel"></div>

  <div class="subfields" id="longformPanel">
    <div class="subfield" id="summaryField">
      <span class="subfield-label">Summary</span>
      <span class="subfield-value" id="summary"></span>
    </div>
    <div class="subfield" id="itineraryField">
      <span class="subfield-label">Itinerary</span>
      <span class="subfield-value" id="itinerary"></span>
    </div>
  </div>

  <div class="subfields" id="descriptionPanel">
    <div class="subfield" id="descriptionField">
      <span class="subfield-label">Description</span>
      <span class="subfield-value rich" id="description"></span>
    </div>
  </div>

  <div class="subfields" id="detailsPanel">
    <div class="subfield" id="detailsField">
      <span class="subfield-label">Details</span>
      <span class="subfield-value rich" id="details"></span>
    </div>
  </div>

  <div class="actions">
    <button class="book-btn" id="bookBtn">Book Now</button>
  </div>
</div>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 1rem;
    background: transparent;
    color: #1a1a1a;
  }
  .card {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .title-bar {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid #cc0000;
    border-radius: 18px;
    padding: 1.6rem 2rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 2.6rem;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.1;
    text-align: center;
    letter-spacing: 0.005em;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .title-bar::after {
    content: '';
    display: block;
    width: 64px;
    height: 3px;
    background: #cc0000;
    margin: 0.7rem auto 0;
    border-radius: 2px;
  }

  .content,
  .content-secondary {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 1.25rem;
    align-items: start;
  }
  .content-secondary:not(:has(.has-content)) { display: none; }
  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    min-width: 0;
  }

  #extraPanel, #longformPanel, #roomsPanel,
  #descriptionPanel, #detailsPanel { display: none; }
  #extraPanel.has-content,
  #longformPanel.has-content,
  #roomsPanel.has-content,
  #descriptionPanel.has-content,
  #detailsPanel.has-content { display: flex; }

  #photoWrap2 { display: none; }
  #photoWrap2.has-content { display: block; }
  .photo-wrap {
    aspect-ratio: 4 / 3;
    border: 1px solid #cc0000;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.5);
    position: relative;
  }
  .featured-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #999;
    font-size: 0.85rem;
  }

  .subfields {
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid #cc0000;
    border-radius: 16px;
    padding: 1.1rem 1.5rem;
  }
  .subfield {
    display: none;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0.85rem 0;
  }
  .subfield.has-content { display: flex; }
  .subfield.has-content ~ .subfield.has-content {
    border-top: 1px solid rgba(204, 0, 0, 0.18);
  }
  .subfield-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #cc0000;
    font-weight: 700;
  }
  .subfield-value {
    font-size: 1.05rem;
    color: #1a1a1a;
    line-height: 1.55;
    white-space: pre-wrap;
    font-weight: 500;
  }
  .subfield-value.rich { white-space: normal; }
  .subfield-value.rich p {
    margin: 0 0 0.5rem 0;
  }
  .subfield-value.rich p:last-child { margin-bottom: 0; }
  .subfield-value.rich ul,
  .subfield-value.rich ol {
    margin: 0 0 0.5rem 1.2rem;
    padding: 0;
  }
  .subfield-value.rich ul:last-child,
  .subfield-value.rich ol:last-child { margin-bottom: 0; }
  .subfield-value.rich .section-divider {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #cc0000;
    font-weight: 700;
    margin: 1.1rem 0 0.4rem 0;
  }
  .subfield-value.rich .section-divider:first-child { margin-top: 0; }

  .cancel-deadline {
    display: none;
    font-weight: 700;
    color: #cc0000;
    margin-bottom: 0.4rem;
  }
  .cancel-deadline.has-content { display: block; }

  .actions {
    display: flex;
    justify-content: center;
    padding: 0.5rem 0;
  }
  .book-btn {
    background: transparent;
    border: 1px solid #2ecc71;
    color: #fff;
    border-radius: 99px;
    padding: 0.8rem 2.5rem;
    min-width: 200px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .book-btn:hover {
    background: #2ecc71;
    border-color: #2ecc71;
    color: #fff;
  }

  @media (max-width: 720px) {
    .content,
    .content-secondary { grid-template-columns: 1fr; }
    .title-bar { font-size: 1.6rem; padding: 1.1rem 1.25rem; }
  }
</style>

<script>
  let currentId = null;

  window.addEventListener('message', (e) => {
    const ev = e.data;
    if (!ev || typeof ev !== 'object') return;
    if (ev.type) return;
    render(ev);
  });

  function render(ev) {
    currentId = ev.id || null;

    document.getElementById('title').textContent = ev.title || '';

    renderPhoto('photoWrap', 'photoFallback', ev.image, ev.title, true);
    renderPhoto('photoWrap2', 'photoFallback2', ev.secondary_image, ev.title, false);

    setSubfield('scheduleField', 'schedule', ev.schedule);
    setSubfield('priceField', 'price', formatPrice(ev.price));
    setSubfield('prereqsField', 'prereqs', ev.prereqs);
    setSubfield('summaryField', 'summary', ev.summary);
    setSubfield('itineraryField', 'itinerary', ev.itinerary);

    setSubfield('includedField', 'included', ev.included);
    setSubfield('notIncludedField', 'notIncluded', ev.not_included);
    setSubfield('transportationField', 'transportation', ev.transportation);
    renderCancellation(ev.cancel_date, ev.cancellation_policy);
    renderRoomOptions(ev.room_options);

    setRichSubfield('descriptionField', 'description', ev.description_html);
    setRichSubfield('detailsField', 'details', ev.details_html);

    togglePanel('extraPanel');
    togglePanel('longformPanel');
    togglePanel('descriptionPanel');
    togglePanel('detailsPanel');

    requestAnimationFrame(postHeight);
  }

  function togglePanel(panelId) {
    const p = document.getElementById(panelId);
    p.classList.toggle('has-content', p.querySelector('.subfield.has-content') !== null);
  }

  function setRichSubfield(fieldId, valueId, html) {
    const field = document.getElementById(fieldId);
    const val = document.getElementById(valueId);
    const trimmed = (html || '').trim();
    if (trimmed) {
      val.innerHTML = trimmed;
      field.classList.add('has-content');
    } else {
      val.innerHTML = '';
      field.classList.remove('has-content');
    }
  }

  function renderRoomOptions(rooms) {
    const panel = document.getElementById('roomsPanel');
    panel.innerHTML = '';
    for (const r of (rooms || [])) {
      if (!r) continue;
      const name = (r.display_title || r.admin_title || '').trim();
      const price = formatRoomAddedPrice(r);
      if (!name && !price) continue;
      panel.appendChild(makeSubfield(name, price, false));
    }
    panel.classList.toggle('has-content', panel.querySelector('.subfield') !== null);
  }

  function formatRoomAddedPrice(r) {
    const cur = (r.currency || 'NTD').trim();
    if (typeof r.added_price === 'number') {
      return '+ ' + r.added_price.toLocaleString() + ' ' + cur;
    }
    if (r.added_price_display) {
      const m = String(r.added_price_display).match(/(-?\d[\d,]*)/);
      if (m) {
        const n = parseInt(m[1].replace(/,/g, ''), 10);
        if (!isNaN(n)) return '+ ' + n.toLocaleString() + ' ' + cur;
      }
      return '+ ' + r.added_price_display;
    }
    return '';
  }

  function makeSubfield(label, body, isHtml) {
    const sub = document.createElement('div');
    sub.className = 'subfield has-content';
    if (label) {
      const lab = document.createElement('span');
      lab.className = 'subfield-label';
      lab.textContent = label;
      sub.appendChild(lab);
    }
    const val = document.createElement('span');
    val.className = 'subfield-value';
    if (isHtml) {
      val.classList.add('rich');
      val.innerHTML = body;
    } else {
      val.textContent = body;
    }
    sub.appendChild(val);
    return sub;
  }

  function renderPhoto(wrapId, fallbackId, src, alt, fallbackOnEmpty) {
    const wrap = document.getElementById(wrapId);
    const fallback = document.getElementById(fallbackId);
    wrap.innerHTML = '';
    wrap.appendChild(fallback);
    if (src) {
      const img = document.createElement('img');
      img.className = 'featured-photo';
      img.src = src;
      img.alt = alt || '';
      img.addEventListener('load', postHeight);
      img.onerror = () => {
        wrap.innerHTML = '';
        wrap.appendChild(fallback);
        fallback.textContent = '(no image)';
        wrap.classList.toggle('has-content', fallbackOnEmpty);
        postHeight();
      };
      wrap.appendChild(img);
      wrap.classList.add('has-content');
    } else if (fallbackOnEmpty) {
      fallback.textContent = '(no image)';
      wrap.classList.add('has-content');
    } else {
      wrap.classList.remove('has-content');
    }
  }

  function renderCancellation(date, policy) {
    const field = document.getElementById('cancellationField');
    const deadline = document.getElementById('cancelDeadline');
    const text = document.getElementById('cancellationText');
    const dateStr = date && String(date).trim() ? String(date).trim() : '';
    const policyStr = policy && String(policy).trim() ? String(policy).trim() : '';
    deadline.textContent = dateStr ? `Cancel by ${dateStr}` : '';
    deadline.classList.toggle('has-content', !!dateStr);
    text.textContent = policyStr;
    field.classList.toggle('has-content', !!(dateStr || policyStr));
  }

  function setSubfield(fieldId, valueId, value) {
    const field = document.getElementById(fieldId);
    if (value && String(value).trim()) {
      document.getElementById(valueId).textContent = value;
      field.classList.add('has-content');
    } else {
      field.classList.remove('has-content');
    }
  }

  function formatPrice(p) {
    if (p == null) return '';
    const n = parseInt(p, 10);
    if (isNaN(n)) return '';
    return n.toLocaleString() + ' NTD';
  }

  document.getElementById('bookBtn').addEventListener('click', () => {
    if (!currentId) return;
    window.parent.postMessage({ type: 'book', id: currentId }, '*');
  });

  function postHeight() {
    const h = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    );
    window.parent.postMessage({ type: 'resize', height: h + 24 }, '*');
  }
  window.addEventListener('DOMContentLoaded', postHeight);
  window.addEventListener('load', postHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(() => postHeight()).observe(document.body);
  }
  setTimeout(postHeight, 100);
  setTimeout(postHeight, 500);
  setTimeout(postHeight, 1500);
</script>
