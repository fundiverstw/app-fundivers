<script>
let allEvents = [];
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
// Filter state — mirrors the PWA: dives toggle as a whole, courses filter
// per-category (by full title). hiddenCourses holds the categories the
// user has switched off.
let diveShown = true;
const hiddenCourses = new Set();

const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dayNames=["S","M","T","W","T","F","S"];

// Course color buckets — mirrors courseColor() in the PWA
// (src/components/calendar/MonthCalendar.tsx) so the two calendars match:
//   Open Water Course      → sky   (.ow)
//   Advanced Open Water    → orange (.aow)
//   everything else        → pink  (.specialty)
// Titles may carry a capacity suffix ("… (2 spots open)") — strip it first.
function stripTitleSuffix(title) {
  return String(title || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
}
function courseColorClass(title) {
  const base = stripTitleSuffix(title);
  if (base.indexOf('Advanced Open Water') === 0) return 'aow';
  if (base.indexOf('Open Water Course') === 0) return 'ow';
  return 'specialty';
}

// Short chip labels for the course-category menu (mirrors COURSE_SHORT in
// the PWA). Unknown titles fall back to the full title.
const COURSE_SHORT = {
  'Open Water Course':   'OW',
  'Advanced Open Water': 'AOW',
  'PADI Rescue Course':  'Rescue',
  'EFR Course':          'EFR',
  'Equipment Course':    'Equipment',
  'Deep Specialty':      'Deep',
};
function courseShortLabel(category) {
  return COURSE_SHORT[stripTitleSuffix(category)] || category;
}

// Category key for a course = its full title (display_title), matching the
// PWA's courseCategories. Calendar segments use calendar_title in `title`,
// so prefer display_title.
function categoryOf(ev) {
  return ev.display_title || ev.title || '';
}
function courseCategoriesOf() {
  const set = new Set();
  allEvents.forEach(ev => { if (ev.type === 'course') set.add(categoryOf(ev)); });
  return Array.from(set).filter(Boolean).sort();
}
// A calendar segment is shown when its type/category is enabled.
function isVisible(ev) {
  return ev.type === 'dive' ? diveShown : !hiddenCourses.has(categoryOf(ev));
}

window.addEventListener("message", e=>{
  allEvents = e.data || [];
  renderCoursesMenu();
  updateChipStates();
  buildCalendar();
});

function init() {
  setupLegend();
  renderCoursesMenu();
  updateChipStates();
  buildCalendar();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Wire the (static) chip handlers once: the Dives toggle, the Courses
// dropdown open/close, and an outside-click that closes the menu.
function setupLegend() {
  const diveChip = document.getElementById('diveChip');
  const coursesChip = document.getElementById('coursesChip');
  const coursesMenu = document.getElementById('coursesMenu');

  diveChip.addEventListener('click', () => {
    diveShown = !diveShown;
    updateChipStates();
    buildCalendar();
  });

  coursesChip.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = coursesMenu.hasAttribute('hidden');
    if (open) coursesMenu.removeAttribute('hidden'); else coursesMenu.setAttribute('hidden', '');
    coursesChip.setAttribute('aria-expanded', String(open));
  });
  // Keep clicks inside the menu from bubbling to the document closer.
  coursesMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => {
    coursesMenu.setAttribute('hidden', '');
    coursesChip.setAttribute('aria-expanded', 'false');
  });
}

// (Re)build the per-category checkboxes. Called when the event set changes
// (categories may differ); NOT on every toggle, so the menu stays open
// while the diver flips categories.
function renderCoursesMenu() {
  const menu = document.getElementById('coursesMenu');
  if (!menu) return;
  menu.innerHTML = '';
  const cats = courseCategoriesOf();
  if (cats.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'chip-menu-empty';
    empty.textContent = 'No courses in view.';
    menu.appendChild(empty);
    return;
  }
  cats.forEach(cat => {
    const label = document.createElement('label');
    label.className = 'chip-menu-item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !hiddenCourses.has(cat);
    cb.addEventListener('change', () => {
      if (cb.checked) hiddenCourses.delete(cat); else hiddenCourses.add(cat);
      updateChipStates();
      buildCalendar();
    });

    const dot = document.createElement('span');
    dot.className = 'chip-menu-dot ' + courseColorClass(cat);

    const short = document.createElement('span');
    short.className = 'chip-menu-short';
    short.textContent = courseShortLabel(cat);

    label.appendChild(cb);
    label.appendChild(dot);
    label.appendChild(short);

    const full = stripTitleSuffix(cat);
    if (courseShortLabel(cat) !== full) {
      const fullEl = document.createElement('span');
      fullEl.className = 'chip-menu-full';
      fullEl.textContent = full;
      label.appendChild(fullEl);
    }
    menu.appendChild(label);
  });
}

// Reflect filter state on the chips: off styling + the "(visible/total)"
// course count.
function updateChipStates() {
  const diveChip = document.getElementById('diveChip');
  const coursesChip = document.getElementById('coursesChip');
  const count = document.getElementById('coursesCount');
  if (diveChip) {
    diveChip.classList.toggle('off', !diveShown);
    diveChip.setAttribute('aria-pressed', String(diveShown));
  }
  const cats = courseCategoriesOf();
  const visible = cats.filter(c => !hiddenCourses.has(c)).length;
  const allHidden = cats.length > 0 && visible === 0;
  if (coursesChip) coursesChip.classList.toggle('off', allHidden);
  if (count) count.textContent = (visible < cats.length && !allHidden) ? ` (${visible}/${cats.length})` : '';
}

document.getElementById("prevMonth").addEventListener("click", ()=>{
  currentMonth--;
  if(currentMonth<0){ currentMonth=11; currentYear--; }
  buildCalendar();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  currentMonth++;
  if(currentMonth>11){ currentMonth=0; currentYear++; }
  buildCalendar();
});

function buildCalendar(){
  const container = document.getElementById("calendarContainer");
  container.innerHTML="";
  buildMonth(container, currentMonth, currentYear);
  const label = document.getElementById("navMonthLabel");
  if (label) label.textContent = `${monthNames[currentMonth]} ${currentYear}`;
  buildEventList(currentMonth, currentYear);
  setTimeout(adjustMultiDayTextWidths, 100);
}

// Format a course/dive's segments (one per consecutive-day run) into a
// human date string, e.g. "Sat, May 9 → May 10, May 16". Single-day runs
// show the weekday; ranges add the end day.
function eventDateLabel(segs) {
  const fmtFull  = (iso) => { const d = parseDateStr(iso); return d ? d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) : iso; };
  const fmtShort = (iso) => { const d = parseDateStr(iso); return d ? d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) : iso; };
  return segs
    .slice()
    .sort((a, b) => (a.start_date < b.start_date ? -1 : 1))
    .map(s => (s.end_date && s.end_date !== s.start_date) ? `${fmtFull(s.start_date)} → ${fmtShort(s.end_date)}` : fmtFull(s.start_date))
    .join(', ');
}

// "This month" list under the grid. Groups the calendar segments back into
// one row per event (a gapped course is several segments sharing an id),
// honors the legend type toggles, hides fully-past events, and sorts by
// date. Clicking a row opens the same detail modal as a calendar bar.
function buildEventList(monthIndex, year) {
  const list = document.getElementById('eventList');
  if (!list) return;
  list.innerHTML = '';

  const heading = document.createElement('div');
  heading.className = 'event-list-title';
  heading.textContent = 'This month';
  list.appendChild(heading);

  const monthStart = new Date(year, monthIndex, 1);
  const monthEnd = new Date(year, monthIndex + 1, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const groups = new Map();
  allEvents.forEach(ev => {
    if (!isVisible(ev)) return;
    const s = parseDateStr(ev.start_date);
    const e = parseDateStr(ev.end_date) || s;
    if (!s) return;
    if (e < monthStart || s > monthEnd) return;
    const key = ev.type + ':' + ev.id;
    if (!groups.has(key)) groups.set(key, { ev, segs: [] });
    groups.get(key).segs.push({ start_date: ev.start_date, end_date: ev.end_date, start: s, end: e });
  });

  const rows = Array.from(groups.values())
    .filter(g => g.segs.some(seg => seg.end >= today))
    .sort((a, b) => Math.min(...a.segs.map(x => x.start.getTime())) - Math.min(...b.segs.map(x => x.start.getTime())));

  if (rows.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'event-row-empty';
    empty.textContent = 'No upcoming events this month.';
    list.appendChild(empty);
    return;
  }

  rows.forEach(({ ev, segs }) => {
    const colorClass = ev.type === 'dive' ? 'dive' : courseColorClass(ev.display_title || ev.title);

    const row = document.createElement('div');
    row.className = 'event-row';

    const main = document.createElement('div');
    main.className = 'event-row-main';

    const head = document.createElement('div');
    head.className = 'event-row-head';

    const pill = document.createElement('span');
    pill.className = 'event-row-pill ' + colorClass;
    pill.textContent = ev.type === 'dive' ? 'Dive' : 'Course';
    head.appendChild(pill);

    const titleEl = document.createElement('span');
    titleEl.className = 'event-row-title';
    titleEl.textContent = ev.display_title || ev.title || '';
    head.appendChild(titleEl);

    if (ev.featured) {
      const star = document.createElement('span');
      star.className = 'event-row-star';
      star.textContent = '★';
      head.appendChild(star);
    }

    const dateEl = document.createElement('div');
    dateEl.className = 'event-row-date';
    dateEl.textContent = eventDateLabel(segs);

    main.appendChild(head);
    main.appendChild(dateEl);
    row.appendChild(main);

    if (ev.starting_at != null && !isNaN(parseInt(ev.starting_at))) {
      const price = document.createElement('div');
      price.className = 'event-row-price';
      price.textContent = 'From ' + parseInt(ev.starting_at) + ' NTD';
      row.appendChild(price);
    }

    row.addEventListener('click', () => showEventDetail(ev));
    list.appendChild(row);
  });
}

function adjustMultiDayTextWidths() {
  const GAP = 1;
  const PADDING = 4;
  const TEXT_STYLES = {
    position: 'absolute',
    overflow: 'hidden',
    textOverflow: 'ellipsis',
    whiteSpace: 'nowrap',
    color: '#fff',
    fontSize: '0.72rem',
    fontWeight: '600',
    zIndex: '20',
    cursor: 'pointer',
    pointerEvents: 'auto',
    height: '18px',
    lineHeight: '18px',
    minWidth: '0',
    paddingLeft: '6px',
    paddingRight: '4px',
    boxSizing: 'border-box'
  };
  
  document.querySelectorAll('.event > span').forEach(span => {
    const eventDiv = span.parentElement;
    const dayDiv = eventDiv.parentElement;
    const daysGrid = dayDiv?.closest('.days');
    if (!daysGrid || !dayDiv?.classList.contains('day')) return;
    
    const dayCount = parseInt(eventDiv.getAttribute('data-day-count')) || 1;
    const dayRect = dayDiv.getBoundingClientRect();
    const gridRect = daysGrid.getBoundingClientRect();
    const eventRect = eventDiv.getBoundingClientRect();

    const dayWidth = dayRect.width;
    if (!dayWidth) return;

    const colIndex = Math.round((dayRect.left - gridRect.left) / dayWidth);
    const daysLeftInRow = 7 - (colIndex % 7);
    const effectiveDayCount = Math.min(dayCount, daysLeftInRow);

    const totalWidth = effectiveDayCount > 1
      ? (dayWidth * effectiveDayCount) + (GAP * (effectiveDayCount - 1)) + 4
      : dayWidth;
    
    const textStyles = { ...TEXT_STYLES };

    Object.assign(span.style, textStyles, {
      left: `${dayRect.left - gridRect.left + 2}px`,
      top: `${eventRect.top - gridRect.top}px`,
      width: `${totalWidth - PADDING}px`,
      maxWidth: `${totalWidth - PADDING}px`
    });
    
    span.addEventListener('click', (e) => {
      e.stopPropagation();
      eventDiv.click();
    });
    
    eventDiv.removeChild(span);
    daysGrid.appendChild(span);
  });
}

function buildMonth(container, monthIndex, year){
  const monthDiv = document.createElement("div");
  monthDiv.className="month";

  const daysDiv = document.createElement("div");
  daysDiv.className="days";

  dayNames.forEach(dn=>{
    const dh = document.createElement("div");
    dh.className="day day-header";
    dh.textContent = dn;
    daysDiv.appendChild(dh);
  });

  const firstDay = new Date(year, monthIndex, 1).getDay();
  const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
  const dayCells = [];

  for(let i=0;i<firstDay;i++){
    const blank = document.createElement("div");
    blank.className="day";
    daysDiv.appendChild(blank);
    dayCells.push(blank);
  }

  const now = new Date();
  const isCurrentMonth = now.getFullYear() === year && now.getMonth() === monthIndex;
  for(let d=1; d<=daysInMonth; d++){
    const dayDiv = document.createElement("div");
    dayDiv.className="day";
    const dateDiv = document.createElement("div");
    dateDiv.className="date";
    dateDiv.textContent=d;
    if(isCurrentMonth && d === now.getDate()){
      dayDiv.classList.add("today");
      dateDiv.classList.add("today");
    }
    dayDiv.appendChild(dateDiv);
    daysDiv.appendChild(dayDiv);
    dayCells.push(dayDiv);
  }

  const eventsInMonth = [];
  allEvents.filter(isVisible).forEach(ev=>{
    const evStart = parseDateStr(ev.start_date);
    const evEnd = parseDateStr(ev.end_date) || parseDateStr(ev.start_date);

    if(evEnd < new Date(year, monthIndex, 1) || evStart > new Date(year, monthIndex, daysInMonth)) return;

    const startDay = Math.max(1, evStart.getDate());
    const endDay = Math.min(daysInMonth, evEnd.getDate());

    eventsInMonth.push({
      event: ev,
      startDay: startDay,
      endDay: endDay,
      track: -1
    });
  });

  eventsInMonth.forEach(eventData => {
    const { startDay, endDay } = eventData;
    let track = 0;
    
    while (true) {
      let conflict = false;
      for (const other of eventsInMonth) {
        if (other.track === track && other !== eventData) {
          if (!(endDay < other.startDay || startDay > other.endDay)) {
            conflict = true;
            break;
          }
        }
      }
      if (!conflict) {
        eventData.track = track;
        break;
      }
      track++;
    }
  });

  eventsInMonth.forEach(eventData => {
    const { event: ev, startDay, endDay, track } = eventData;

    const isMultiDay = startDay !== endDay;
    // Courses get a color bucket (ow/aow/specialty) derived from the full
    // title; flat fills come from CSS — no per-overlap shading (the app
    // separates overlaps by stacking tracks, which we already do).
    const bucket = ev.type === 'course' ? ' ' + courseColorClass(ev.display_title || ev.title) : '';
    const label = (ev.featured ? '★ ' : '') + (ev.title || '');

    if(isMultiDay) {
      for(let d=startDay; d<=endDay; d++){
        const dayDiv = dayCells[firstDay + d -1];
        if(dayDiv) dayDiv.classList.add("has-multi-day");
      }
    }

    for(let d=startDay; d<=endDay; d++){
      const dayDiv = dayCells[firstDay + d -1];
      if(!dayDiv) continue;

      const evDiv = document.createElement("div");
      evDiv.className = `event ${ev.type}${bucket}${ev.featured ? ' featured' : ''}`;

      if(isMultiDay) {
        if(d === startDay) {
          evDiv.classList.add("multi-day", "start");
        } else if(d === endDay) {
          evDiv.classList.add("multi-day", "end");
        } else {
          evDiv.classList.add("multi-day", "middle");
        }
      }

      if(d === startDay || !isMultiDay) {
        const textSpan = document.createElement("span");
        textSpan.textContent = label;
        evDiv.appendChild(textSpan);
        evDiv.title = ev.title;
        if(isMultiDay && d === startDay) {
          evDiv.setAttribute('data-day-count', endDay - startDay + 1);
        }
      } else {
        evDiv.title = ev.title;
      }

      const topOffset = 24 + track * 20;
      evDiv.style.top = `${topOffset}px`;

      evDiv.addEventListener("click", ()=>showEventDetail(ev));
      dayDiv.appendChild(evDiv);
    }
  });

  monthDiv.appendChild(daysDiv);
  container.appendChild(monthDiv);
}

const eventDetailModal = document.getElementById("eventDetailModal");
const detailType = document.getElementById("detailType");
const detailTitle = document.getElementById("detailTitle");
const detailDate = document.getElementById("detailDate");
const detailPrice = document.getElementById("detailPrice");
const detailLink = document.getElementById("detailLink");
const bookLink = document.getElementById("bookLink");
document.getElementById("closeDetail").addEventListener("click", ()=>eventDetailModal.style.display="none");

eventDetailModal.addEventListener("click", (e)=>{
  if(e.target === eventDetailModal){
    eventDetailModal.style.display="none";
  }
});

function parseDateStr(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(dateString) {
  if (!dateString) return "";
  const date = parseDateStr(dateString);
  const options = { year: 'numeric', month: 'long', day: 'numeric' };
  return date.toLocaleDateString('en-US', options);
}

function showEventDetail(ev){
  eventDetailModal.classList.toggle('course', ev.type === 'course');
  eventDetailModal.classList.toggle('dive',   ev.type === 'dive');
  eventDetailModal.classList.toggle('featured', !!ev.featured);

  detailType.className = 'type-chip ' + ev.type;
  detailType.textContent = ev.type === 'dive' ? 'Dive' : 'Course';

  detailTitle.textContent = ev.display_title || '';

  let dateText = formatDate(ev.start_date);
  if(ev.end_date && ev.end_date !== ev.start_date) {
    dateText += " → " + formatDate(ev.end_date);
  }
  detailDate.textContent = dateText;

  const priceValue = ev.starting_at != null
    ? (typeof ev.starting_at === 'number' ? ev.starting_at : parseInt(ev.starting_at))
    : NaN;
  detailPrice.textContent = isNaN(priceValue) ? 'Contact for pricing' : `Starting at ${priceValue} NTD`;

  detailLink.onclick = () => window.parent.postMessage({ type: 'details_event', eventId: ev.id, eventType: ev.type }, '*');
  detailLink.classList.remove("hidden");

  bookLink.onclick = () => window.parent.postMessage({ type: 'book_event', eventId: ev.id, eventType: ev.type }, '*');
  bookLink.classList.remove("hidden");

  eventDetailModal.style.display="block";
}
</script>
