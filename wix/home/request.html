<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: transparent;
    padding: 8px;
    margin: 0;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .section-header {
    text-align: center;
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 4px 0 14px;
  }

  .actions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    width: 100%;
  }

  .action {
    position: relative;
    aspect-ratio: 5 / 3;
    border-radius: 16px;
    border: 1px solid #cc0000;
    background: rgba(255, 255, 255, 0.2);
    color: #1a1a1a;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    font: inherit;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  }
  .action:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.18); background: rgba(255, 255, 255, 0.35); }
  .action.active { box-shadow: 0 0 0 2px #2ecc71 inset; }

  .action-icon {
    width: 56px;
    height: 56px;
    color: #2ecc71;
  }
  .action-label {
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
  }

  /* FORM PANEL — appears below the action grid when Try-Dive or Course is clicked. */
  .form-wrap {
    margin-top: 14px;
    border: 1px solid #cc0000;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.2);
    padding: 18px 20px;
    color: #1a1a1a;
  }
  .form-wrap.hidden { display: none; }

  .form-title {
    font-size: 1.15rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .form-row label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #888;
    font-weight: 600;
  }
  .form-row input,
  .form-row textarea {
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 0.95rem;
    color: #1a1a1a;
    width: 100%;
  }
  .form-row textarea {
    resize: vertical;
    min-height: 80px;
  }

  .captcha-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 14px;
    flex-wrap: wrap;
  }
  .captcha-row label {
    font-size: 0.85rem;
    color: #1a1a1a;
  }
  .captcha-row .q {
    font-weight: 700;
    color: #cc0000;
    margin: 0 4px;
  }
  .captcha-row input {
    flex: 0 0 80px;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    color: #1a1a1a;
  }
  .captcha-error {
    font-size: 0.8rem;
    color: #cc0000;
    margin-top: 4px;
    font-weight: 600;
  }
  .captcha-error.hidden { display: none; }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 18px;
    min-width: 130px;
    background: transparent;
    border: 1px solid #2ecc71;
    color: #1a1a1a;
    border-radius: 99px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .btn:hover { background: #2ecc71; border-color: #2ecc71; color: #fff; }
  .btn[disabled] { opacity: 0.6; cursor: not-allowed; }
  .btn[disabled]:hover { background: transparent; color: #1a1a1a; }

  .success {
    margin-top: 14px;
    padding: 16px;
    border: 1px solid #2ecc71;
    border-radius: 16px;
    color: #1a1a1a;
    text-align: center;
    background: rgba(255, 255, 255, 0.2);
  }
  .success.hidden { display: none; }
</style>
</head>
<body>
  <h2 class="section-header">Get In Touch</h2>

  <div class="actions">
    <button type="button" class="action" data-action="calendar">
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="action-label">See Full Calendar</span>
    </button>

    <button type="button" class="action" data-action="try-dive">
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="9" r="5"></circle>
        <path d="M9 13l-2 8M15 13l2 8"></path>
        <path d="M7 9h-3M20 9h-3"></path>
      </svg>
      <span class="action-label">Schedule a Try-Dive</span>
    </button>

    <button type="button" class="action" data-action="course">
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10L12 5 2 10l10 5 10-5z"></path>
        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        <line x1="22" y1="10" x2="22" y2="16"></line>
      </svg>
      <span class="action-label">Request a Course</span>
    </button>
  </div>

  <form class="form-wrap hidden" id="requestForm" novalidate>
    <h3 class="form-title" id="formTitle"></h3>
    <div class="form-row">
      <label for="reqName">Name</label>
      <input id="reqName" name="name" required autocomplete="name">
    </div>
    <div class="form-row">
      <label for="reqEmail">Email</label>
      <input id="reqEmail" name="email" type="email" required autocomplete="email">
    </div>
    <div class="form-row">
      <label for="reqMessage">Your Request</label>
      <textarea id="reqMessage" name="message" required placeholder="Dates you're interested in, experience level, anything else we should know..."></textarea>
    </div>
    <div class="captcha-row">
      <label for="reqCaptcha">Are you human? <span class="q" id="captchaQ"></span>=</label>
      <input id="reqCaptcha" name="captcha" type="number" inputmode="numeric" required>
    </div>
    <div class="captcha-error hidden" id="captchaError">That answer wasn't right — try the new question.</div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="cancel">Cancel</button>
      <button type="submit" class="btn">Send Request</button>
    </div>
  </form>

  <div class="success hidden" id="successMsg">
    Thanks! We've received your request and will be in touch shortly.
  </div>

  <div class="success hidden" id="errorMsg" style="border-color:#cc0000;">
    Sorry — something went wrong sending that. Please try again, or email
    <strong>fundiverstw@gmail.com</strong> directly.
  </div>

<script>
  // Submissions postMessage to the parent (home.js), which calls the backend
  // sendRequest webMethod — that uses Gmail SMTP via nodemailer to email
  // fundiverstw@gmail.com. The parent posts a { type: 'request_result', ok }
  // ack so the iframe can show success or an error.

  let captchaA = 0, captchaB = 0;
  let currentRequestType = null;

  const form        = document.getElementById('requestForm');
  const formTitle   = document.getElementById('formTitle');
  const successMsg  = document.getElementById('successMsg');
  const errorMsg    = document.getElementById('errorMsg');
  const captchaQ    = document.getElementById('captchaQ');
  const captchaErr  = document.getElementById('captchaError');
  const captchaIn   = document.getElementById('reqCaptcha');
  let   submitting  = false;

  function newCaptcha() {
    captchaA = Math.floor(Math.random() * 9) + 1;
    captchaB = Math.floor(Math.random() * 9) + 1;
    captchaQ.textContent = ` ${captchaA} + ${captchaB} `;
    captchaIn.value = '';
    captchaErr.classList.add('hidden');
  }

  function setActive(action) {
    document.querySelectorAll('.action').forEach(a => {
      a.classList.toggle('active', a.dataset.action === action);
    });
  }

  function showForm(type, title) {
    currentRequestType = type;
    formTitle.textContent = title;
    successMsg.classList.add('hidden');
    form.classList.remove('hidden');
    form.reset();
    newCaptcha();
    setActive(type);
    form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideForm() {
    form.classList.add('hidden');
    currentRequestType = null;
    setActive(null);
  }

  document.querySelectorAll('.action').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'calendar') {
        window.open('https://www.fundiverstw.com/calendar', '_top');
      } else if (action === 'try-dive') {
        showForm('try-dive', 'Schedule a Try-Dive');
      } else if (action === 'course') {
        showForm('course', 'Request a Course');
      }
    });
  });

  form.querySelector('[data-action="cancel"]').addEventListener('click', hideForm);

  const submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (submitting) return;

    const captchaVal = parseInt(captchaIn.value, 10);
    if (captchaVal !== captchaA + captchaB) {
      captchaErr.classList.remove('hidden');
      newCaptcha();
      captchaIn.focus();
      return;
    }

    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    errorMsg.classList.add('hidden');

    window.parent.postMessage({
      type: 'request_submit',
      requestType: currentRequestType,
      name:    document.getElementById('reqName').value.trim(),
      email:   document.getElementById('reqEmail').value.trim(),
      message: document.getElementById('reqMessage').value.trim(),
    }, '*');
  });

  // Parent (home.js) acks with { type: 'request_result', ok }.
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'request_result') return;
    submitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Request';
    if (d.ok) {
      hideForm();
      successMsg.classList.remove('hidden');
      successMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      errorMsg.classList.remove('hidden');
      errorMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
</script>
</body>
</html>
