<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: transparent; padding: 8px; margin: 0; width: 100%; overflow: hidden; box-sizing: border-box; }

  .section-header {
    text-align: center;
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 4px 0 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
    width: 100%;
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 6;
    border-radius: 28%;
    border: 1px solid #cc0000;
    overflow: hidden;
    box-shadow: none;
    transition: transform 0.2s, box-shadow 0.2s;
    background: #0a2a4a;
  }

  .card-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 60%, transparent 100%);
    z-index: 1;
  }

  .card-info {
    position: absolute;
    bottom: 22%;
    left: 12%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 75%;
  }

  .card-title { font-size: 1.2rem; font-weight: 700; color: #fff; line-height: 1.2; }
  .card-date { font-size: 0.9rem; color: #4a90e2; font-weight: 600; }
  .card-schedule { font-size: 0.85rem; color: rgba(255,255,255,0.8); }
  .card-price { font-size: 0.95rem; font-weight: 700; color: #ffd700; }

  .card-actions {
    position: absolute;
    bottom: 10%;
    left: 12%;
    z-index: 2;
    display: flex;
    gap: 5px;
  }

  .btn {
    padding: 6px 12px;
    min-width: 90px;
    background: transparent;
    border: 1px solid #2ecc71;
    color: #fff;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .btn:hover { background: #2ecc71; border-color: #2ecc71; color: #fff; }
</style>
</head>
<body>
  <h2 class="section-header">Upcoming Courses</h2>
  <div class="grid" id="grid"></div>
  <script>
    function details(id)  { window.open('https://www.fundiverstw.com/course/' + encodeURIComponent(id), '_top'); }
    function book(id)     { window.open('https://app.fundiverstw.com/register/course/' + encodeURIComponent(id), '_top'); }

    // Render the days a course runs on (EO_courses.course_days, max 4),
    // grouping consecutive dates into ranges — e.g. "May 9–10, May 16".
    // Falls back to the start/end envelope for any legacy row without the
    // array. Dates are formatted in UTC so a bare calendar date doesn't
    // shift a day for viewers west of UTC.
    function courseDates(c) {
      let raw = c.course_days;
      if (typeof raw === 'string') raw = raw.replace(/^\{|\}$/g, '').split(',');
      let days = (Array.isArray(raw) ? raw : []).map(s => String(s).slice(0, 10)).filter(Boolean);
      if (!days.length) days = [c.start_date, c.end_date].filter(Boolean).map(s => String(s).slice(0, 10));
      days = Array.from(new Set(days)).sort();
      if (!days.length) return '';
      const runs = [];
      for (const d of days) {
        const last = runs[runs.length - 1];
        if (last && (new Date(d + 'T00:00:00Z') - new Date(last[1] + 'T00:00:00Z')) === 86400000) last[1] = d;
        else runs.push([d, d]);
      }
      const fmt = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      return runs.map(([a, b]) => a === b ? fmt(a) : `${fmt(a)}–${fmt(b)}`).join(', ');
    }

    window.addEventListener('message', (e) => {
      const courses = e.data;
      if (!Array.isArray(courses)) return;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      courses.forEach(c => {
        const imgSrc = (c.featured_image || '').replace(/^wix:image:\/\/v1\//, 'https://static.wixstatic.com/media/').split('#')[0].split('/').slice(0,-1).join('/') || '';
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${imgSrc ? `<img class="card-bg" src="${imgSrc}" onerror="this.style.display='none'">` : ''}
          <div class="card-overlay"></div>
          <div class="card-info">
            <div class="card-title">${c.display_title || c.title || ''}</div>
            <div class="card-date">${courseDates(c)}</div>
            ${c.schedule ? `<div class="card-schedule">${c.schedule}</div>` : ''}
            ${c.starting_at != null ? `<div class="card-price">From ${parseInt(c.starting_at)} NTD</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn btn-details" data-action="details">Details</button>
            <button class="btn btn-book"    data-action="book">Book Now</button>
          </div>
        `;
        card.querySelector('[data-action="details"]').addEventListener('click', () => details(c._id));
        card.querySelector('[data-action="book"]').addEventListener('click', () => book(c._id));
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
