# The SPA worker that serves app.fundiverstw.com. The name and the custom-domain
# route are what production already runs under; renaming the worker would
# create a second one and leave the domain bound to the old. `main` points into
# the platform package; `fundive deploy` builds nothing, so run `fundive build`
# (or `make deploy`) first.
name = "app-fundiverstw"
main = "node_modules/fundive/src/worker.ts"
compatibility_date = "2026-04-01"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "app.fundiverstw.com"
zone_name = "fundiverstw.com"
custom_domain = true
enabled = true
previews_enabled = false

[placement]
mode = "smart"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
