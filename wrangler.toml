# The worker that serves your app. Rename it before the first deploy if you
# like; once it is live, keep the name (a new name is a second worker).
name = "app-fundiverstw"
main = "node_modules/fundive/src/worker.ts"
compatibility_date = "2026-04-01"
workers_dev = true
preview_urls = true

# Your own domain, once you have one on Cloudflare:
[[routes]]
pattern = "app.fundiverstw.com"
zone_name = "fundiverstw.com"
custom_domain = true
enabled = true
previews_enabled = false

[placement]
mode = "smart"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
