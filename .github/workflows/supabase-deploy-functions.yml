# Manual Supabase edge function deploy. Trigger from the GitHub Actions UI:
#   Actions → "Deploy Supabase edge functions" → Run workflow.
#
# Mirrors `make deploy-functions` (npm run functions:deploy) but runs from CI
# against the linked cloud project instead of a local checkout. Deploys
# every function under supabase/functions/ in one go — the CLI handles
# diffing and only ships what changed.
#
# Reuses the same two secrets as the migration-push workflow:
#   SUPABASE_ACCESS_TOKEN   — personal access token (sbp_...)
#   SUPABASE_PROJECT_REF    — project ref slug
#
# (No DB password needed; this only talks to the Functions platform API.)
#
# H7 hardening (2026-06-03):
#   * Job only runs when dispatched from main, same as supabase-push.
#   * environment: production for protection rules in Settings.
#   * Actions SHA-pinned with version comments.
name: Deploy Supabase edge functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
