# Manual deploy: Actions → "Deploy" → Run workflow → pick a target.
# The same commands as deploying from a laptop, run from a clean checkout so a
# deploy does not depend on one machine holding the credentials. Nothing ships
# because a commit landed, and schema is a separate button (Push migrations):
# code that needs a new column deploys after the column exists.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID             SPA and push worker
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#   VITE_TURNSTILE_SITE_KEY                                  SPA (the build fails without them)
#   VITE_VAPID_PUBLIC_KEY, VITE_PUSH_WORKER_URL              SPA, optional
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF              edge functions
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: all
        type: choice
        options: [all, spa, push-worker, edge-functions]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  spa:
    name: SPA (Cloudflare Worker)
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'spa') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx fundive build
        env:
          VITE_SUPABASE_URL:       ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:  ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_VAPID_PUBLIC_KEY:   ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_WORKER_URL:    ${{ secrets.VITE_PUSH_WORKER_URL }}
      - name: Deploy
        run: npx fundive deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  push-worker:
    name: Push cron (Cloudflare Worker)
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'push-worker') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The worker's runtime secrets stay on Cloudflare (`wrangler secret put`);
      # a deploy neither carries nor changes them.
      - name: Deploy
        run: npx fundive deploy push
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  edge-functions:
    name: Supabase edge functions
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'edge-functions') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sets FUNDIVE_CONFIG from fundive.config.ts, then deploys every function.
      # GMAIL_* and TURNSTILE_SECRET stay on Supabase, untouched.
      - name: Deploy
        run: npx fundive functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
