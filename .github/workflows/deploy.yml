# Manual Cloudflare deploy. Trigger from the GitHub Actions UI:
#   Actions → "Deploy to Cloudflare" → Run workflow → pick a target.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN     — token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID    — visible in the Cloudflare dashboard sidebar
#   VITE_SUPABASE_URL        — baked into the SPA bundle at build time
#   VITE_SUPABASE_ANON_KEY   — baked into the SPA bundle at build time
#   VITE_VAPID_PUBLIC_KEY    — optional; push UI hides itself if absent
#   VITE_TURNSTILE_SITE_KEY  — Cloudflare Turnstile site key (H2)
#
# H7 hardening (2026-06-03):
#   * top-level permissions: contents: read so a compromised action
#     can't write to the repo / open PRs with the runner token.
#   * Every action is SHA-pinned; the trailing `# vX.Y.Z` comments
#     are for human readers — git tags are mutable, SHAs are not.
#   * environment: production gates the deploy on whatever protection
#     rules are set in Settings → Environments (required reviewers,
#     wait timers, etc.). The workflow declares the environment;
#     repo Settings is where the actual reviewers list lives.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - spa
          - push

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy-spa:
    if: ${{ inputs.target == 'spa' || inputs.target == 'both' }}
    name: Deploy SPA (app-fundiverstw)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:       ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:  ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY:   ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUSH_WORKER_URL:    ${{ secrets.VITE_PUSH_WORKER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-push:
    if: ${{ inputs.target == 'push' || inputs.target == 'both' }}
    name: Deploy push cron (fundivers-push)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/push/package-lock.json
      - run: npm ci
        working-directory: workers/push
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/push
