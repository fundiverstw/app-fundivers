# Manual Supabase migration push. Trigger from the GitHub Actions UI:
#   Actions → "Push Supabase migrations" → Run workflow.
#
# Mirrors `make push` (npm run db:push) but runs from CI against the
# linked cloud project instead of a local checkout.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   — personal access token; create at
#                             https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    — the project ref (the slug in the dashboard URL)
#   SUPABASE_DB_PASSWORD    — the project's Postgres password
#
# H7 hardening (2026-06-03):
#   * Job only runs when the workflow is dispatched from main. A
#     workflow_dispatch from any other ref will exit 0 with no-op so
#     someone can't push a PR branch's migrations to production.
#   * environment: production gates execution on whatever protection
#     rules are configured in Settings → Environments.
#   * Actions are SHA-pinned; trailing comments document the version.
name: Push Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-push
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pin an explicit version — `latest` resolves the tag via the
          # GitHub Releases API, which is rate-limited on shared runners
          # ("Failed to resolve latest Supabase CLI release: rate limit
          # exceeded"). Matches the supabase devDependency in package.json.
          version: 2.91.3

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
