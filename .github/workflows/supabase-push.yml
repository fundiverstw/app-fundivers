# Manual Supabase migration push. Trigger from the GitHub Actions UI:
#   Actions → "Push Supabase migrations" → Run workflow.
#
# Mirrors `make push` (npm run db:push) but runs from CI against the
# linked cloud project instead of a local checkout.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   — personal access token; create at
#                             https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    — the project ref (the slug in the dashboard URL)
#   SUPABASE_DB_PASSWORD    — the project's Postgres password
name: Push Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-push
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
