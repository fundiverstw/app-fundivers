# Pre-merge gate. Fails the branch in GitHub on any regression that
# `make check` would catch locally — eslint, tsc, or the unit test
# project.
#
# Runs on:
#   - direct push to main (direct commits / fast-forwards)
#   - PR targeting main (before merge)
#
# Integration + security probe suites are NOT in this workflow — they
# require the local Supabase stack (Docker). When CI grows a Supabase
# step, add an `integration` job here that depends on it.
#
# Three independent jobs run in parallel so a single failure shows
# alongside the other two, not in series. In-flight runs for the same
# ref are cancelled when a new commit lands so a long queue can't
# shadow newer fixes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: workers/push
      - run: npx vitest run --project unit
