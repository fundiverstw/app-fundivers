# Dependabot config. Opens a PR every time a pinned GitHub Action ships a
# new tag, with the new commit SHA already swapped in and the changelog
# summarised in the PR body. Pairs with the SHA-pinning we did for audit
# H7 — pinning gives us immutability, Dependabot gives us a timely
# upgrade path so the pins don't go stale and miss security fixes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
  # L8 — keep npm deps fresh on both the SPA (root) and the push
  # worker. Patch updates get grouped into one PR per ecosystem so the
  # noise stays low; minor / major releases each get their own PR so
  # the changelog gets read.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      patch:
        applies-to: version-updates
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /workers/push
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(push)
    groups:
      patch:
        applies-to: version-updates
        update-types:
          - patch
