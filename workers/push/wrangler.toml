# The push-notification worker: booking reminders, waitlist offers, admin
# broadcasts. Optional; skip it and the app works without push. Keep the name
# once it is live: a second push worker would run the crons twice.
name = "fundivers-push"
main = "../../node_modules/fundive/workers/push/src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 2 * * *", "*/15 * * * *"]

[vars]
VAPID_SUBJECT = "mailto:fundiverstw@gmail.com"
ALLOWED_ORIGINS = "https://app.fundiverstw.com"
TIMEZONE = "Asia/Taipei"
CURRENCY = "TWD"
