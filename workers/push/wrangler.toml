# The push-notification cron worker. Keep the name: a worker under any other
# name is a second worker, and both would run the crons (double reminders,
# double waitlist offers). Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, ADMIN_TRIGGER_SECRET) are already set on
# the live worker and survive a redeploy.
name = "fundivers-push"
main = "../../node_modules/fundive/workers/push/src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 2 * * *", "*/15 * * * *"]

[vars]
VAPID_SUBJECT = "mailto:fundiverstw@gmail.com"
ALLOWED_ORIGINS = "https://app.fundiverstw.com"
TIMEZONE = "Asia/Taipei"
CURRENCY = "TWD"
